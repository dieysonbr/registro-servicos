    <!-- SDKs do Firebase (Versão Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBvwGE-z1U684L7qglv8SnAscY0Tp6MoE",
            authDomain: "surgeos.firebaseapp.com",
            projectId: "surgeos",
            storageBucket: "surgeos.firebasestorage.app",
            messagingSenderId: "580234358141",
            appId: "1:580234358141:web:633eb879d8b5baaf213014"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.inicializarSistemaColaboradores();
                window.carregarDadosFirebase();
            }
        });

        signInAnonymously(auth).catch((erro) => {
            console.error("Erro ao autenticar sessão anônima:", erro);
            Swal.fire({
                icon: 'error',
                title: 'Erro de Conexão',
                text: 'Não foi possível conectar ao sistema. Verifique sua internet e recarregue a página.'
            });
        });
    </script>
